name: cla

# Asks each new contributor to sign CLA.md once, by comment, and records the
# signature in the cla-signatures branch. pull_request_target gives the token
# write access on pull requests from forks; that is safe here because this
# workflow never checks out or runs the pull request's code.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/ai-agentic-tools/Foil/blob/main/CLA.md
          branch: cla-signatures
          allowlist: umbarsariya,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
