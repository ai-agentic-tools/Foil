name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Two kernels and userlands GitHub offers; older kernels and other
        # distributions run in VMs: bench/matrix/lima-matrix.sh.
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      # The runner has passwordless sudo: the full-disk test must run.
      FOIL_REQUIRE_SUDO: "1"
      FOIL_DIFF_CASES: "500"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Ubuntu >= 23.10 restricts unprivileged user namespaces; `foil setup`
      # installs the AppArmor profile that lets the foil binary use them, as
      # a customer would. From here on, branch and isolation tests must run.
      - name: Allow foil to use user namespaces
        run: |
          cargo build
          sudo target/debug/foil setup
          echo "FOIL_REQUIRE_BRANCH=1" >> "$GITHUB_ENV"

      # The runner's own cgroup is not delegated and there is no systemd user
      # session yet, so this run exercises the subreaper-only fallback
      # (cgroup and limit tests skip themselves).
      - name: Test (fallback, no cgroup box)
        run: cargo test --all-targets

      # Start a systemd user manager so the runner gets a delegated cgroup.
      - name: Enable a systemd user session
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          for i in $(seq 30); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 1; done

      - name: Test (cgroup box and limits required)
        run: systemd-run --user --scope -q env FOIL_REQUIRE_CGROUP=1 FOIL_REQUIRE_LIMITS=1 cargo test --all-targets

      - name: Doctor
        run: target/debug/foil doctor

  # Speed (family J): measured on every push and kept as an artifact; gated
  # against bench/baseline-ci.json once one is committed.
  bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and allow user namespaces
        run: |
          cargo build --release
          sudo target/release/foil setup
      - name: foilbench
        run: FOIL=$PWD/target/release/foil python3 bench/foilbench.py --quick --out foilbench.json
      # Shared runners have noisy neighbours: a metric over its limit is
      # measured once more, and fails only if it is over in both runs.
      - name: Gate against the CI baseline
        run: |
          if [ -f bench/baseline-ci.json ]; then
            python3 bench/foilbench.py --gate bench/baseline-ci.json --tolerance 0.5 foilbench.json || {
              echo "over the limit: measuring again"
              FOIL=$PWD/target/release/foil python3 bench/foilbench.py --quick --out foilbench-2.json
              python3 bench/foilbench.py --gate bench/baseline-ci.json --tolerance 0.5 foilbench.json foilbench-2.json
            }
          else
            echo "no bench/baseline-ci.json yet: commit this run's foilbench.json as the baseline"
          fi
      - name: Show the numbers
        run: cat foilbench.json
      # Uploads can fail when the account's artifact quota is full; the
      # numbers are in the log above either way.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: foilbench
          path: foilbench.json
          retention-days: 7

  # The same suite inside a Docker container, with the settings from
  # contrib/docker/README.md.
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build && cargo test --no-run --all-targets
      - name: Allow foil to use user namespaces (host AppArmor)
        run: sudo target/debug/foil setup
      - name: Test inside a container
        run: contrib/docker/test-in-container.sh

  # A static binary on every push (kept 7 days); on a v* tag, also a
  # GitHub release with the binary and its SHA-256 (what install.sh fetches).
  release:
    needs: [test, container]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Static binary
        run: |
          sudo apt-get install -y musl-tools
          cargo build --release --target x86_64-unknown-linux-musl
          mkdir dist
          cp target/x86_64-unknown-linux-musl/release/foil dist/foil-x86_64-linux
          cd dist && sha256sum foil-x86_64-linux > foil-x86_64-linux.sha256
      - name: Smoke test the static binary
        run: |
          sudo dist/foil-x86_64-linux setup
          dist/foil-x86_64-linux doctor
          FOIL=$PWD/dist/foil-x86_64-linux sh examples/best-of-n/demo.sh
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: foil-x86_64-linux
          path: dist/
          retention-days: 7
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## " v {on=1; next} /^## / {on=0} on' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/* --title "foil $GITHUB_REF_NAME" --notes "$notes"
