name: Bug report
description: foil did something wrong, or failed where it should work.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A security problem (something inside a run could do what it should not)? Please report it privately instead: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The exact command line, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest set of steps or a script that shows it.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: foil doctor
      description: Output of `foil --version` and `foil doctor`.
      render: text
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Distribution and kernel (`uname -r`), or macOS version and chip.
    validations:
      required: true
