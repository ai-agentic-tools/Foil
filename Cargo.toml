[package]
name = "foil"
version = "0.4.0"
edition = "2021"
description = "Instant copy-on-write branches and a sandbox for AI agents working in your repo"
license = "MIT OR Apache-2.0"
repository = "https://github.com/umbarsariya/foil"
readme = "README.md"
keywords = ["sandbox", "ai-agents", "overlayfs", "copy-on-write", "linux"]
categories = ["command-line-utilities", "development-tools", "filesystem"]
# Distributed as release binaries; not on crates.io.
publish = false

[dependencies]
libc = "0.2"
# TLS for the network proxy's key injection (strict mode); ring is the crypto backend.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "overhead"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true
