[package]
name = "foil-sandbox"
version = "0.4.0"
edition = "2021"
description = "A local sandbox for AI coding agents: instant copy-on-write branches of your repo, reviewed before they are committed"
license = "Apache-2.0"
repository = "https://github.com/ai-agentic-tools/foil"
homepage = "https://ai-agentic-tools.github.io/Foil/"
readme = "README.md"
keywords = ["sandbox", "ai-agents", "claude-code", "copy-on-write", "llm"]
categories = ["command-line-utilities", "development-tools", "filesystem"]
# On crates.io as foil-sandbox (the name foil is taken); the library and the
# command are still called foil.
include = ["/src", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/NOTICE", "/CHANGELOG.md"]

[lib]
name = "foil"

[[bin]]
name = "foil"
path = "src/main.rs"

[dependencies]
libc = "0.2"
# TLS for the network proxy's key injection (strict mode); ring is the crypto backend.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
# JSON for `foil serve`, which speaks the OpenSandbox APIs.
serde_json = "1"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "overhead"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true
